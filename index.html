<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Ulang Tahun Gereja - Berdampak</title>
    <!-- Menghubungkan ke file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        
        <!-- Header / Banner -->
        <div class="header-banner">
            <p class="header-subtitle">Undangan Ulang Tahun Gereja GPA</p>
            <h1 class="header-title">BERDAMPAK</h1>
            <p class="header-quote">"Demikianlah hendaknya terangmu bercahaya di depan orang..."</p>
            
            <div class="header-info-grid">
                <div>
                    <span class="info-label">TANGGAL</span>
                    <span>27 September 2026</span>
                </div>
                <div>
                    <span class="info-label">WAKTU</span>
                    <span>12.00 WIB</span>
                </div>
            </div>
        </div>

        <!-- Form RSVP -->
        <form id="rsvpForm" class="form-body">
            
            <!-- Nama Lengkap -->
            <div class="form-group">
                <label class="form-label">Nama Lengkap *</label>
                <input type="text" name="nama" required placeholder="Masukkan nama Anda" class="form-input">
            </div>

            <!-- Nomor HP / WhatsApp -->
            <div class="form-group">
                <label class="form-label">Nomor WhatsApp / HP *</label>
                <input type="tel" name="telepon" required placeholder="08xxxxxxxxxx" class="form-input">
            </div>

            <!-- Alamat Rumah -->
            <div class="form-group">
                <label class="form-label">Alamat Rumah / Wilayah *</label>
                <textarea name="alamat" rows="2" required placeholder="Alamat singkat atau domisili" class="form-textarea"></textarea>
            </div>

            <!-- Status Kehadiran -->
            <div class="form-group">
                <label class="form-label">Konfirmasi Kehadiran *</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="kehadiran" value="Hadir" checked class="radio-input"> Hadir
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="kehadiran" value="Berhalangan" class="radio-input"> Berhalangan
                    </label>
                </div>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" id="submitBtn" class="btn-submit">
                Kirim Konfirmasi
            </button>
        </form>

        <!-- Pesan Sukses -->
        <div id="successMessage" class="success-container hidden">
            <div class="success-icon">✨</div>
            <h2 class="success-title">Terima Kasih!</h2>
            <p class="success-text">Konfirmasi Anda telah kami terima. Sampai jumpa di acara Ulang Tahun Gereja pada 27 September 2026!</p>
        </div>

    </div>

    <!-- Menghubungkan ke file JavaScript eksternal -->
    <script src="script.js"></script>
</body>
</html>
